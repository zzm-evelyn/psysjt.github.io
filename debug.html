<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地调试工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }

    .debug-container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Warning banner */
    .debug-warning {
      background: #2d1a1a;
      border: 1px solid #5a2a2a;
      border-left: 4px solid #e74c3c;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #e88;
    }

    .debug-warning strong {
      color: #e74c3c;
    }

    /* Header */
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .debug-header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: 0.5px;
    }

    .debug-header .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .debug-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Section */
    .debug-section {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .debug-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: #2a2a2a;
      border-bottom: 1px solid #333;
      cursor: pointer;
      user-select: none;
    }

    .debug-section-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #ccc;
    }

    .debug-section-header .toggle-icon {
      color: #666;
      font-size: 12px;
      transition: transform 0.2s;
    }

    .debug-section-header .toggle-icon.collapsed {
      transform: rotate(-90deg);
    }

    .debug-section-body {
      padding: 14px 16px;
      overflow-x: auto;
    }

    .debug-section-body.hidden {
      display: none;
    }

    /* Data table */
    .debug-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .debug-table th {
      text-align: left;
      padding: 6px 10px;
      border-bottom: 2px solid #333;
      color: #999;
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .debug-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #2a2a2a;
      vertical-align: top;
    }

    .debug-table tr:hover td {
      background: #252525;
    }

    .debug-table .dim-label {
      color: #7ab8e0;
    }

    .debug-table .dim-desc {
      font-size: 11px;
      color: #777;
      display: block;
      margin-top: 1px;
    }

    .debug-table .overall-row td {
      background: #1a2a1a;
      font-weight: 600;
      color: #8d8;
    }

    /* Key-value list */
    .debug-kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 20px;
      font-size: 13px;
    }

    .debug-kv .key {
      color: #999;
      white-space: nowrap;
    }

    .debug-kv .value {
      color: #ccc;
      word-break: break-all;
    }

    .debug-kv .value.empty {
      color: #555;
      font-style: italic;
    }

    .debug-kv .value.null {
      color: #555;
    }

    /* Raw JSON */
    .debug-raw {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre-wrap;
      color: #8d8d8d;
      margin-top: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    /* Empty state */
    .debug-empty {
      color: #555;
      font-style: italic;
      font-size: 13px;
      padding: 8px 0;
    }

    /* Buttons */
    .btn-debug {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      background: #2a2a2a;
      color: #ccc;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn-debug:hover {
      background: #333;
      border-color: #666;
    }

    .btn-debug.danger {
      border-color: #5a2a2a;
      color: #e88;
    }

    .btn-debug.danger:hover {
      background: #3a1a1a;
      border-color: #8a3a3a;
    }

    .btn-debug.primary {
      border-color: #2a4a6a;
      color: #8ab8e0;
    }

    .btn-debug.primary:hover {
      background: #1a2a3a;
      border-color: #4a7aaa;
    }

    /* Toast */
    .debug-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #eee;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
      pointer-events: none;
      border: 1px solid #444;
    }

    .debug-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Tab counts */
    .stat-badge {
      display: inline-block;
      background: #333;
      padding: 0 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #999;
      margin-left: 6px;
    }

    .nav-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }

    .nav-link:hover {
      color: #999;
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .debug-header { flex-direction: column; }
      .debug-actions { width: 100%; }
      .debug-actions .btn-debug { flex: 1; justify-content: center; }
      .debug-section-body { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="debug-container">

    <!-- Warning -->
    <div class="debug-warning">
      <strong>⚠ 开发调试工具</strong> — 仅用于本地开发阶段检查 localStorage 数据，不是正式管理端。
      所有被试数据查看、Excel 导出、权限保护等功能需在 Python 后端阶段实现。
    </div>

    <!-- Header -->
    <div class="debug-header">
      <div>
        <h1>🔧 本地调试工具</h1>
        <div class="subtitle">localStorage 数据检查 · 仅限当前浏览器</div>
      </div>
      <div class="debug-actions">
        <button class="btn-debug primary" onclick="exportJSON()">📥 导出 JSON</button>
        <button class="btn-debug primary" onclick="exportCSV()">📊 导出 CSV</button>
        <button class="btn-debug danger" onclick="clearAll()">✕ 清空数据</button>
      </div>
    </div>

    <!-- Section: 参与者信息 -->
    <div class="debug-section">
      <div class="debug-section-header" onclick="toggleSection(this)">
        <h2>👤 参与者信息</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="debug-section-body" id="participantInfo">
        <div class="debug-empty">加载中...</div>
      </div>
    </div>

    <!-- Section: 作答记录 -->
    <div class="debug-section">
      <div class="debug-section-header" onclick="toggleSection(this)">
        <h2>📋 问卷作答</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="debug-section-body" id="questionnaireResponses">
        <div class="debug-empty">加载中...</div>
      </div>
    </div>

    <div class="debug-section">
      <div class="debug-section-header" onclick="toggleSection(this)">
        <h2>🎬 剧情作答</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="debug-section-body" id="gameResponses">
        <div class="debug-empty">加载中...</div>
      </div>
    </div>

    <!-- Section: 结果得分 -->
    <div class="debug-section">
      <div class="debug-section-header" onclick="toggleSection(this)">
        <h2>📊 结果得分</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="debug-section-body" id="resultScores">
        <div class="debug-empty">加载中...</div>
      </div>
    </div>

    <!-- Section: 原始数据 -->
    <div class="debug-section">
      <div class="debug-section-header" onclick="toggleSection(this)">
        <h2>📄 原始 localStorage</h2>
        <span class="toggle-icon">▼</span>
      </div>
      <div class="debug-section-body" id="rawData">
        <div class="debug-empty">加载中...</div>
      </div>
    </div>

    <a class="nav-link" href="index.html">← 返回首页</a>
  </div>

  <div class="debug-toast" id="debugToast"></div>

  <script src="js/config.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/debug.js"></script>
</body>
</html>
