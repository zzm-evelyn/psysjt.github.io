<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理学问卷</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="questionnaireTitle" class="study-title">📋 心理学问卷</h1>

      <!-- 问卷介绍 -->
      <div id="questionnaireIntro">
        <div id="questionnaireIntroText" class="research-info">
          <p>以下题目描述了人们在日常生活中可能有的感受和行为。请根据您的真实情况，选择最符合您的选项。</p>
          <p>每题请只选择一个答案，答案没有对错之分，请放心作答。</p>
        </div>
        <button id="startQuestionnaire" class="btn btn-primary btn-block btn-lg">开始作答</button>
      </div>

      <!-- 问卷主体 -->
      <div id="questionnaireBody" style="display: none;">
        <!-- 进度条 -->
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div id="progressText" class="progress-text">准备开始</div>
        </div>

        <!-- 题号范围 -->
        <div id="questionNumber" class="question-number"></div>

        <!-- 题目渲染区（多题同页） -->
        <div id="questionArea" class="question-area"></div>

        <!-- 错误提示 -->
        <div id="errorMessage" class="error-message">请先完成本题</div>

        <!-- 导航按钮 -->
        <div class="nav-buttons">
          <button id="nextBtn" class="btn btn-primary" onclick="goToNext()">下一页</button>
        </div>

        <!-- 提交确认区域 -->
        <div id="submitArea" style="display:none; text-align:center; padding: 2rem 1rem;">
          <div style="font-size:2.5rem; margin-bottom:1rem;">📝</div>
          <h2>您已完成所有题目</h2>
          <p style="color:var(--text-secondary); margin-bottom:1.5rem;">
            请确认您的回答无误后，点击下方按钮提交问卷。<br>
            提交后将无法修改答案。
          </p>
          <button id="submitBtn" class="btn btn-success btn-lg" onclick="handleSubmit()">
            提交问卷
          </button>
        </div>

        <!-- 完成区域 -->
        <div id="completeArea" class="complete-area" style="display:none;">
          <p id="questionnaireCompletionText">✓ 问卷已提交，非常感谢您的耐心作答！</p>
          <button class="btn btn-success btn-lg" onclick="navigateTo('game.html')">
            进行下一步
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/apiClient.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/storage.js?v=20260612-session-fix2"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
  <script src="js/questionnaire.js"></script>
</body>
</html>
