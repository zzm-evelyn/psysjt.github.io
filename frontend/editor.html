<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容编辑器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="editor-body">
  <!-- ====== Header ====== -->
  <header class="editor-header">
    <div class="editor-header-inner">
      <h1 class="editor-logo">📝 内容编辑器</h1>
      <span class="editor-badge">本地版</span>
      <div class="editor-actions">
        <button class="btn btn-sm btn-secondary" onclick="exportJSON()">📥 导出 JSON</button>
        <button class="btn btn-sm btn-secondary" onclick="importJSON()">📤 导入 JSON</button>
        <button class="btn btn-sm btn-secondary btn-danger-outline" onclick="resetData()">↺ 重置</button>
      </div>
    </div>
  </header>

  <!-- ====== Tabs ====== -->
  <div class="editor-tabs">
    <button class="editor-tab active" data-tab="questionnaire" onclick="switchTab('questionnaire')">
      📋 问卷题目 <span class="tab-count" id="qCount">0</span>
    </button>
    <button class="editor-tab" data-tab="game" onclick="switchTab('game')">
      🎬 剧情情景 <span class="tab-count" id="sCount">0</span>
    </button>
  </div>

  <!-- ====== Main Content ====== -->
  <div class="editor-main">
    <!-- Left Panel: List -->
    <aside class="editor-list-panel" id="listPanel">
      <div class="list-header">
        <span class="list-count">共 0 项</span>
        <button class="btn btn-primary btn-sm" onclick="addNew()">+ 新增</button>
      </div>
      <div class="list-items">
        <div class="list-empty">加载中...</div>
      </div>
    </aside>

    <!-- Right Panel: Form -->
    <main class="editor-form-panel">
      <!-- ====== Questionnaire Form ====== -->
      <div id="questionnaireForm" class="editor-form" style="display:none;">
        <div class="form-section-title">基本信息</div>

        <div class="form-row">
          <div class="form-group form-group-id">
            <label>question_id</label>
            <input id="edit_question_id" class="form-input" readonly>
          </div>
          <div class="form-group form-group-type">
            <label>question_type</label>
            <select id="edit_question_type" class="form-input">
              <option value="likert">likert</option>
              <option value="multiple_choice">multiple_choice</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>question_text</label>
          <textarea id="edit_question_text" class="form-textarea" rows="2"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group form-group-check">
            <label><input id="edit_required" type="checkbox"> required（必答）</label>
          </div>
          <div class="form-group form-group-check">
            <label><input id="edit_reverse_q" type="checkbox"> reverse_scored（反向计分）</label>
          </div>
        </div>

        <div class="form-row form-row-3col">
          <div class="form-group">
            <label>scale_min</label>
            <input id="edit_scale_min" type="number" class="form-input" value="1">
          </div>
          <div class="form-group">
            <label>scale_max</label>
            <input id="edit_scale_max" type="number" class="form-input" value="5">
          </div>
        </div>

        <div class="form-section-title">维度设置</div>

        <div class="form-group">
          <label>预定义维度（选择后自动填充下方字段）</label>
          <select id="edit_q_dimension" class="form-input"></select>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>dimension_name</label>
            <input id="edit_q_dimension_name" class="form-input" placeholder="例：开放性-审美">
          </div>
          <div class="form-group">
            <label>dimension_code</label>
            <input id="edit_q_dimension_code" class="form-input" placeholder="例：openness_aesthetic">
          </div>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>parent_dimension</label>
            <input id="edit_q_parent_dimension" class="form-input" placeholder="例：开放性">
          </div>
          <div class="form-group">
            <label>parent_dimension_code</label>
            <input id="edit_q_parent_code" class="form-input" placeholder="例：openness">
          </div>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>facet_name</label>
            <input id="edit_q_facet_name" class="form-input" placeholder="例：审美">
          </div>
          <div class="form-group">
            <label>facet_code</label>
            <input id="edit_q_facet_code" class="form-input" placeholder="例：aesthetic">
          </div>
        </div>

        <!-- Options Sub-form -->
        <div class="form-section-title">选项设置</div>
        <div id="optionsForm_q"></div>

        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveItem()">💾 保存</button>
          <button id="deleteBtn_q" class="btn btn-secondary" onclick="deleteItem()" style="display:none;">🗑 删除</button>
        </div>
      </div>

      <!-- ====== Game Scenes Form ====== -->
      <div id="gameForm" class="editor-form" style="display:none;">
        <div class="form-section-title">基本信息</div>

        <div class="form-row">
          <div class="form-group form-group-id">
            <label>scene_id</label>
            <input id="edit_scene_id" class="form-input" readonly>
          </div>
          <div class="form-group form-group-order">
            <label>scene_order</label>
            <input id="edit_scene_order" type="number" class="form-input" value="1">
          </div>
        </div>

        <div class="form-group">
          <label>scene_title</label>
          <input id="edit_scene_title" class="form-input" placeholder="例：列车旅途">
        </div>

        <div class="form-group">
          <label>scene_text（剧情正文）</label>
          <textarea id="edit_scene_text" class="form-textarea" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label>question_text（问句）</label>
          <textarea id="edit_scene_question_text" class="form-textarea" rows="2"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group form-group-check">
            <label><input id="edit_reverse_s" type="checkbox"> reverse_scored（反向计分）</label>
          </div>
          <div class="form-group form-group-url">
            <label>background_image_url</label>
            <input id="edit_bg_url" class="form-input" placeholder="assets/images/xxx.jpg">
          </div>
        </div>

        <div class="form-section-title">维度设置</div>

        <div class="form-group">
          <label>预定义维度</label>
          <select id="edit_s_dimension" class="form-input"></select>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>dimension_name</label>
            <input id="edit_s_dimension_name" class="form-input">
          </div>
          <div class="form-group">
            <label>dimension_code</label>
            <input id="edit_s_dimension_code" class="form-input">
          </div>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>parent_dimension</label>
            <input id="edit_s_parent_dimension" class="form-input">
          </div>
          <div class="form-group">
            <label>parent_dimension_code</label>
            <input id="edit_s_parent_code" class="form-input">
          </div>
        </div>

        <div class="form-row form-row-2col">
          <div class="form-group">
            <label>facet_name</label>
            <input id="edit_s_facet_name" class="form-input">
          </div>
          <div class="form-group">
            <label>facet_code</label>
            <input id="edit_s_facet_code" class="form-input">
          </div>
        </div>

        <!-- Options Sub-form -->
        <div class="form-section-title">选项设置</div>
        <div id="optionsForm_s"></div>

        <div class="form-actions">
          <button class="btn btn-primary" onclick="saveItem()">💾 保存</button>
          <button id="deleteBtn_s" class="btn btn-secondary" onclick="deleteItem()" style="display:none;">🗑 删除</button>
        </div>
      </div>

      <!-- Empty State -->
      <div id="editorEmpty" class="editor-empty">
        <div class="editor-empty-icon">📝</div>
        <p>选择一个项目编辑，或点击"+ 新增"创建新内容</p>
      </div>
    </main>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
