<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理学问卷</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="study-title">📋 心理学问卷</h1>

      <!-- 问卷介绍 -->
      <div id="questionnaireIntro">
        <div class="research-info">
          <p>以下题目描述了人们在日常生活中可能有的感受和行为。请根据您的真实情况，选择最符合您的选项。</p>
          <p>每题请只选择一个答案，答案没有对错之分，请放心作答。</p>
        </div>
        <button id="startQuestionnaire" class="btn btn-primary btn-block btn-lg">开始作答</button>
      </div>

      <!-- 问卷主体 -->
      <div id="questionnaireBody" style="display: none;">
        <!-- 进度条 -->
        <div class="progress-container">
          <div class="progress-bar-bg">
            <div id="progressFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div id="progressText" class="progress-text">1 / 3</div>
        </div>

        <!-- 题号 -->
        <div id="questionNumber" class="question-number"></div>

        <!-- 题目 -->
        <div id="questionText" class="question-text"></div>

        <!-- Likert Scale -->
        <div id="likertSection" class="likert-section">
          <div class="likert-scale" id="likertScale">
            <div class="likert-track" id="likertTrack">
              <div class="likert-track-fill" id="likertFill"></div>
            </div>
            <div class="likert-options" id="likertOptions"></div>
          </div>
        </div>

        <!-- 错误提示 -->
        <div id="errorMessage" class="error-message">请先完成本题</div>

        <!-- 导航按钮 -->
        <div class="nav-buttons">
          <button id="prevBtn" class="btn btn-secondary" onclick="goToPrev()" style="display:none;">上一题</button>
          <button id="nextBtn" class="btn btn-primary" onclick="goToNext()">下一题</button>
        </div>

        <!-- 完成区域 -->
        <div id="completeArea" class="complete-area">
          <p>✓ 问卷填写完成，非常感谢您的耐心作答！</p>
          <button class="btn btn-success btn-lg" onclick="navigateTo('game.html')">
            进入剧情体验
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/mockData.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
  <script src="js/questionnaire.js"></script>
</body>
</html>
